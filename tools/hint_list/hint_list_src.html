<title>Xenogears Story Hints</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working list. Sticky toolbar (view, search, step jump, filters) over either the hint cards (number rail on the left,
   text and page table on the right) or the story-step table grouped by chapter. Same family as the Room Viewer. */
:root{
 --bg:#eef0f4; --panel:#ffffff; --ink:#1b202b; --dim:#5e6778; --line:#d6dae3; --soft:#f5f6f9;
 --gold:#8a6420; --gold-bg:#f6ecd8; --green:#23793a; --green-bg:#e2f2e5; --warn:#94560a; --warn-bg:#fbeedb; --flash:#fff3c9;
 --display:"Saira Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1218; --panel:#161b24; --ink:#dfe3ea; --dim:#8c95a6; --line:#283041; --soft:#1b212c;
 --gold:#d7a54a; --gold-bg:#2a2414; --green:#82d391; --green-bg:#16281b; --warn:#e9a23b; --warn-bg:#2b2112; --flash:#3a3016; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1218; --panel:#161b24; --ink:#dfe3ea; --dim:#8c95a6; --line:#283041; --soft:#1b212c;
 --gold:#d7a54a; --gold-bg:#2a2414; --green:#82d391; --green-bg:#16281b; --warn:#e9a23b; --warn-bg:#2b2112; --flash:#3a3016; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
header.top{padding-block:22px 10px;display:flex;flex-direction:column;gap:6px}
h1{font:700 32px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h1 span{color:var(--gold)}
.lede{color:var(--dim);max-width:70ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--panel)}
button,input,select{font:500 13px var(--body);color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible,summary:focus-visible,tr[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input[type=search],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
#q{flex:1 1 220px}
#jump{width:84px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.note{color:var(--dim);font-size:12px}
#msg{min-height:1.2em}
main{display:flex;flex-direction:column;gap:12px;padding-top:14px}
/* hint cards */
.hint{display:grid;grid-template-columns:128px minmax(0,1fr);gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;scroll-margin-top:150px}
.hint.flash{background:var(--flash);transition:background .8s}
.hk{display:flex;flex-direction:column;gap:2px}
.hk .num{font:700 34px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.hk .lbl{font:600 10px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.hk .cov{font:12px var(--mono);color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb{display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ch{font:600 12px var(--body);color:var(--ink)}
.ch+.ch::before{content:"→ ";color:var(--dim);font-weight:400}
.pill{font:600 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;white-space:nowrap}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.no{background:var(--warn-bg);color:var(--warn)}
.pill.n{background:var(--soft);color:var(--dim)}
.text{margin:0;max-width:78ch;font-size:15px}
.text.un{color:var(--dim)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:7px 8px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.pg,td.id,td.xz{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.says{min-width:220px;max-width:46ch}
td.room{min-width:150px}
.carry{color:var(--dim)}
.spot{color:var(--green)}
.nospot{color:var(--dim)}
.cp{padding:2px 7px;font-size:11px}
details.more{font-size:13px}
details.more summary{cursor:pointer;color:var(--dim);font-size:12px}
details.more ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.split{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.split h3{font:600 12px var(--body);margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* story steps table */
#stepsView .tbl{background:var(--panel)}
#stepsView td{white-space:nowrap}
#stepsView td.t{white-space:normal;min-width:240px;color:var(--dim)}
#stepsView tr.step{cursor:pointer}
#stepsView tr.step:hover td{background:var(--soft)}
#stepsView tr.chap td{background:var(--gold-bg);color:var(--gold);font:600 12px var(--body);letter-spacing:.03em}
#stepsView tr.flash td{background:var(--flash)}
.hl{color:var(--gold);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--dim)}
@media (max-width:640px){.bar{position:static}.hint{grid-template-columns:1fr;gap:6px}.hk{flex-direction:row;align-items:baseline;gap:8px}.hk .cov{margin-top:0}h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){.hint.flash{transition:none}}
</style>

<div class="wrap">
 <header class="top">
  <h1>Xenogears <span>Story Hints</span></h1>
  <p class="lede">Every story step and the hint Xenogears Link shows for it. The app shows the hint whose step is the next one above the story step you're on, one page at a time: each page has one sentence of the hint and one room, with its green spot.</p>
  <div class="stats" id="stats"></div>
 </header>
 <div class="bar">
  <div class="row">
   <div class="seg" role="group" aria-label="View"><button id="vHints" aria-pressed="true">Hint steps</button><button id="vSteps" aria-pressed="false">Story steps</button></div>
   <input type="search" id="q" placeholder="Search text, room, area or chapter" aria-label="Search">
   <label class="note" for="jump">Story step</label><input type="number" id="jump" min="0" max="353" placeholder="0–353"><button id="jumpGo">Go</button>
  </div>
  <div class="row"><div class="chips" id="filters" role="group" aria-label="Show"></div><span class="note" id="msg"></span></div>
 </div>
 <main id="hintsView"></main>
 <main id="stepsView" hidden></main>
</div>

<script>
(function(){
'use strict';
var D=/*HINT_DATA*/null;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var H=D.hints,CH=D.chapters,byK={};H.forEach(function(h){byK[h.k]=h});
/* the steps each hint covers: from the previous hint step up to one below its own (the app: first hint step above the story step) */
H.forEach(function(h,i){h.from=i?H[i-1].k:0;h.to=h.k-1});
function chapterOf(s){var n='';for(var i=0;i<CH.length&&CH[i][0]<=s;i++)n=CH[i][1];return n}
function chaptersIn(a,b){var o=[];for(var s=a;s<=b;s++){var c=chapterOf(s);if(o.indexOf(c)<0)o.push(c)}return o}
function hintFor(s){for(var i=0;i<H.length;i++)if(H[i].k>s)return H[i];return null}
function roomName(f){if(f==null)return '';if(f<0)return 'World map';var r=D.rooms[f]||['',''];return r[0]||(r[1]?r[1]+' '+f:'Room '+f)}
function areaName(f){if(f==null||f<0)return f<0?'World map':'';return (D.rooms[f]||['',''])[1]}
function xz(p){return p[0]+', '+p[1]}

var view=store('xsh.view')==='steps'?'steps':'hints',filt=store('xsh.filt')||'all',q='';
var FILTERS=[['all','All'],['un','Not checked in game'],['ok','Checked in game'],['world','Has a world map page'],['nospot','Has a page with no spot'],['split','Changes partway']];
function pass(h){
 if(filt==='un'&&!h.unchecked)return false;if(filt==='ok'&&h.unchecked)return false;
 if(filt==='world'&&!h.pages.some(function(p){return p[1]===-1}))return false;
 if(filt==='nospot'&&!h.pages.some(function(p){return p[4]&&!p[2].length}))return false;
 if(filt==='split'&&!h.splits.length)return false;
 if(!q)return true;
 var hay=[h.k,h.text,chaptersIn(h.from,h.to).join(' ')].concat(h.pages.map(function(p){return p[1]==null?'':p[1]+' '+roomName(p[1])+' '+areaName(p[1])})).concat(h.splits.map(function(s){return s.text||''})).join(' ').toLowerCase();
 return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0})}

function pagesTable(pages){
 return '<div class="tbl"><table><thead><tr><th>Pg</th><th>Says</th><th>Room</th><th>Area</th><th>Green spot (x, z)</th><th></th></tr></thead><tbody>'
 +pages.map(function(p,i){var f=p[1],sp=p[2];
  var spot=f==null?'':sp.length?sp.map(function(s){return '<span class="spot">'+xz(s)+'</span>'}).join('<br>'):'<span class="nospot">no spot'+(f>=0?': the room only':'')+'</span>';
  var copy=f==null?'':f+(sp.length?' ('+xz(sp[0])+')':'');
  return '<tr><td class="pg">'+(i+1)+'</td><td class="says'+(p[3]?'':' carry')+'">'+(p[3]?esc(p[0]):'<span title="The text has fewer sentences than the path has rooms: the last one stays on screen">(same as above)</span>')+'</td>'
   +'<td class="room'+(p[4]?'':' carry')+'">'+(f==null?'':'<span class="mono">'+f+'</span> '+esc(roomName(f)))+'</td><td>'+esc(areaName(f))+'</td><td class="xz">'+spot+'</td>'
   +'<td>'+(copy?'<button class="cp" data-copy="'+esc(copy)+'" title="Copy as: room (x, z)">Copy</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div>'}

function card(h){
 var ch=chaptersIn(h.from,h.to),np=h.pages.length,ns=h.pages.filter(function(p){return p[4]&&p[2].length}).length;
 var o='<article class="hint" id="h'+h.k+'"><div class="hk"><span class="lbl">Hint step</span><span class="num">'+h.k+'</span><span class="cov">story steps '+(h.from===h.to?h.from:h.from+'–'+h.to)+'</span></div><div class="hb">'
 +'<div class="meta">'+ch.map(function(c){return '<span class="ch">'+esc(c)+'</span>'}).join('')
 +(h.unchecked?'<span class="pill no">Not checked in game</span>':'<span class="pill ok">Checked in game</span>')
 +'<span class="pill n">'+np+' page'+(np>1?'s':'')+' · '+ns+' spot'+(ns===1?'':'s')+'</span></div>'
 +'<p class="text'+(h.unchecked?' un':'')+'">'+esc(h.text||'(no text)')+'</p>'+pagesTable(h.pages);
 h.splits.forEach(function(s,i){
  o+='<div class="split"><h3>Part '+(i+2)+': once '+s.when.map(function(w){return 'switch <span class="mono">'+w[0]+'</span> bit <span class="mono">0x'+w[1].toString(16).toUpperCase()+'</span>'}).join(' and ')+' is set</h3>';
  if(s.text!=null)o+='<p class="text'+(s.unchecked?' un':'')+'">'+esc(s.text)+(s.unchecked?' <span class="pill no">Not checked in game</span>':'')+'</p>'+pagesTable(s.pages);
  else o+='<p class="note">The app drops '+(s.dropS.length?'sentence'+(s.dropS.length>1?'s ':' ')+s.dropS.map(function(x){return x+1}).join(', '):'no sentences')+(s.dropP.length?' and page'+(s.dropP.length>1?'s ':' ')+s.dropP.map(function(x){return x+1}).join(', '):'')+' (that part is done).</p>';
  o+='</div>'});
 o+='<details class="more"><summary>Where the game’s scripts set story step '+h.k+'</summary><ul>'+h.set.map(function(r){return '<li>Room <span class="mono">'+r[0]+'</span> '+esc(roomName(r[0]))+', script routine <span class="mono">'+r[1]+'</span>'+(r.length>3?', person at <span class="mono">'+r[2]+', '+r[3]+'</span>':', no fixed place')+'</li>'}).join('')+'</ul></details>';
 return o+'</div></article>'}

function renderHints(){var L=H.filter(pass);$('hintsView').innerHTML=L.length?L.map(card).join(''):'<div class="empty">No hint steps match. Clear the search or pick All.</div>';return L.length}
function renderSteps(){
 var o='',cur=null,n=0;
 for(var s=0;s<D.steps;s++){var h=hintFor(s),c=chapterOf(s);
  if(filt!=='all'||q){if(!h||!pass(h))continue}
  if(c!==cur){cur=c;var end=s;while(end+1<D.steps&&chapterOf(end+1)===c)end++;o+='<tr class="chap"><td colspan="4">'+esc(c)+' · story steps '+(s===end?s:s+'–'+end)+'</td></tr>'}
  var p=h&&h.pages[0];n++;
  o+='<tr class="step" id="s'+s+'" tabindex="0" data-h="'+(h?h.k:'')+'"><td class="id">'+s+'</td><td class="id">'+(h?'<span class="hl">'+h.k+'</span>':'none')+'</td>'
   +'<td>'+(p&&p[1]!=null?'<span class="mono">'+p[1]+'</span> '+esc(roomName(p[1])):'')+'</td><td class="t">'+(h?esc(h.pages[0][0]||h.text):'Nothing more to point to.')+'</td></tr>'}
 $('stepsView').innerHTML=n?'<div class="tbl"><table><thead><tr><th>Story step</th><th>Hint step</th><th>First room</th><th>First page says</th></tr></thead><tbody>'+o+'</tbody></table></div>':'<div class="empty">No story steps match. Clear the search or pick All.</div>';return n}
function render(){
 $('filters').innerHTML=FILTERS.map(function(f){return '<button class="chip" data-f="'+f[0]+'" aria-pressed="'+(filt===f[0])+'">'+f[1]+'</button>'}).join('');
 $('vHints').setAttribute('aria-pressed',view==='hints');$('vSteps').setAttribute('aria-pressed',view==='steps');
 $('hintsView').hidden=view!=='hints';$('stepsView').hidden=view!=='steps';
 var n=view==='hints'?renderHints():renderSteps();
 $('msg').textContent=(filt!=='all'||q)?n+(view==='hints'?' hint steps':' story steps')+' shown':''}

/* scroll the entry to just below the toolbar (sticky on wide screens), then highlight it */
function flash(el){if(!el)return;el.classList.add('flash');var bar=document.querySelector('.bar'),off=getComputedStyle(bar).position==='sticky'?bar.offsetHeight+12:12;
 window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-off,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});setTimeout(function(){el.classList.remove('flash')},1600)}
function openHint(k){if(view!=='hints'||!document.getElementById('h'+k)){view='hints';filt='all';q='';$('q').value='';store('xsh.view',view);store('xsh.filt',filt);render()}flash($('h'+k))}
function jump(){var s=parseInt($('jump').value,10);if(!(s>=0&&s<D.steps)){$('msg').textContent='Type a story step from 0 to '+(D.steps-1)+'.';return}
 var h=hintFor(s);if(view==='steps'){filt='all';q='';$('q').value='';render();flash($('s'+s))}else if(h)openHint(h.k);
 $('msg').textContent='Story step '+s+' ('+chapterOf(s)+') shows '+(h?'hint step '+h.k+'.':'no hint: nothing more to point to.')}

$('vHints').onclick=function(){view='hints';store('xsh.view',view);render()};
$('vSteps').onclick=function(){view='steps';store('xsh.view',view);render()};
$('filters').onclick=function(e){var b=e.target.closest('[data-f]');if(!b)return;filt=b.getAttribute('data-f');store('xsh.filt',filt);render()};
var qt;$('q').oninput=function(){clearTimeout(qt);qt=setTimeout(function(){q=$('q').value.trim().toLowerCase();render()},120)};
$('jumpGo').onclick=jump;$('jump').onkeydown=function(e){if(e.key==='Enter')jump()};
$('stepsView').onclick=function(e){var tr=e.target.closest('tr.step');if(tr&&tr.getAttribute('data-h'))openHint(+tr.getAttribute('data-h'))};
$('stepsView').onkeydown=function(e){if(e.key==='Enter'){var tr=e.target.closest('tr.step');if(tr&&tr.getAttribute('data-h'))openHint(+tr.getAttribute('data-h'))}};
document.addEventListener('click',function(e){var b=e.target.closest('.cp');if(!b)return;var t=b.getAttribute('data-copy');
 var done=function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1200)};
 try{navigator.clipboard.writeText(t).then(done,function(){b.textContent=t})}catch(err){b.textContent=t}});

var np=0,ns=0,un=0;H.forEach(function(h){np+=h.pages.length;ns+=h.pages.filter(function(p){return p[4]&&p[2].length}).length;if(h.unchecked)un++});
$('stats').innerHTML='<span><b>'+D.steps+'</b> story steps</span><span><b>'+H.length+'</b> hint steps</span><span><b>'+np+'</b> pages</span><span><b>'+ns+'</b> green spots</span><span><b>'+un+'</b> not checked in game</span><span>Link data '+esc(D.source||'')+'</span>';
render();
/* #h10 opens hint step 10, #s8 story step 8 */
var m=/^#([hs])(\d+)$/.exec(location.hash||'');if(m){if(m[1]==='h')openHint(+m[2]);else{$('jump').value=m[2];view='steps';render();jump()}}
})();
</script>
