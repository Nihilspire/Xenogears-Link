 var shs=sh&&document.querySelector('.shop'),shy=shs?shs.scrollTop:0;   /* the shop list and the deathblow list keep their scroll place across a redraw */
 var dbs=document.querySelector('#dbl>.in'),dby=dbs?dbs.scrollTop:0,dbw=dbSel;
 put('main',ed?endingView():bl?battlerView():sh?shopView(sh):pk?partyPickView(pk):de?discEndView():dl?(rpsView()||speedView()||'<div class="ttlwrap"><img class="ttl" src="img/title.png" onclick="openSet()"></div>'):bt?battleView():(speedView()||fieldView()));
 if(bt&&dby&&dbw===dbSel){dbs=document.querySelector('#dbl>.in');if(dbs)dbs.scrollTop=dby}if(shy){shs=document.querySelector('.shop');if(shs)shs.scrollTop=shy}
 if(!ed&&!dl&&!bt&&!bl&&!sh&&tab==='map')drawMap();encDraw();moreHint();
 /* bottom bar: nothing in dialogue, the shop's name in a shop, the rewards in a fight, otherwise the four tabs; FF is always there */
 var b='';if(dl)b+='<span class="sp"></span>';
 else if(bl)b+=win(T('BATTLE ARENA','y')+'<span class="sp"></span>'+T('BATTLER','g'),'rew');
 else if(sh)b+=win(T(sh.k===4?'ITEM SHOP':'GEAR SHOP','y')+'<span class="sp"></span>'+T('GREEN','n')+T(': YOU HAVE ONE','g'),'rew');
 else if(bt)b+=battleTot?win(T('Rewards:','y')+'<span class="sp"></span>'+T('EXP','c')+T(pad(cm(battleTot[0]),8))+T(pad(cm(battleTot[1]),9))+T(' G','y'),'rew',CFG.dev?'onclick="showLog()"':''):'<span class="sp"></span>';
 else [['status','STATUS'],['equip','EQUIP'],['items','ITEMS'],['map','MAP'],['journal',remSize()[0]<380?'LOG':'JOURNAL']].forEach(function(t){b+=win(T(t[1],tab===t[0]?'y':'g'),'btn'+(tab===t[0]?' on':''),'onclick="setTab(\''+t[0]+'\')"')});
 b+=win(T('FF',ffOn?'n':'w'),'btn nar'+(ffOn?' on':''),'onclick="ff()"');put('bot',b)}
/* small arrow above the bottom bar while the EQUIP list has more below */
function moreHint(){var m=document.getElementById('main'),e=document.getElementById('more');e.style.display=m.className==='scroll'&&m.scrollTop+m.clientHeight<m.scrollHeight-4&&!document.getElementById('app').className?'block':'none'}
document.getElementById('main').addEventListener('scroll',moreHint);
/* switch tab */
function setTab(t){var ch=t!==tab;tab=t;LS.set('tab',t);fullKey='';poll();render();if(ch)fadeMain(120)}
/* v2.0.0.14: a short fade-in of the main area when the screen changes (map, battle, cutscene, tab) */
function fadeMain(ms){var m=document.getElementById('main');if(m&&m.animate)try{m.animate([{opacity:0},{opacity:1}],{duration:ms||180,easing:'ease-out'})}catch(e){}}
/* toggle RetroArch's fast forward */
function ff(){ffOn=!ffOn;if(HAS_NATIVE)Native.send(CFG.host,CFG.port,'FAST_FORWARD');render()}
/* ================= settings panel ================= */
var lastSet='';
/* a small tappable label; on = lit */
function chip(label,on,js){return '<span class="chip'+(on?' on':'')+'" onclick="'+js+'">'+T(label,on?'y':'w')+'</span>'}
/* a settings row with ON and OFF chips for one switch */
/* open the settings panel */
function openSet(){lastSet='';document.getElementById('set').className='show';drawSet()}
/* let the app take keyboard focus (only while typing the host or port) */
function kb(on){if(HAS_NATIVE&&Native.focusable)Native.focusable(!!on)}
/* close the settings panel and redraw */
function closeSet(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();kb(0);document.getElementById('set').className='';last={};fullKey='';fit();render()}
/* the DEV readout: raw values behind everything the app shows, one line each, for checking against the game */
function dash(v){return v==null?'-':v}
/* the lines of raw values at the bottom of the dev options */
function readout(){var f=u16(A.FIELD),world=u32(A.SIG)===5,o=[];f=f==null?null:f&0x7FF;
 o.push('native '+HAS_NATIVE,'link '+(linkMode||'probing '+MODES[probeIdx]),'replies '+(lastReply||'-')+'  '+pollRate()+' polls a second','program '+u32(A.MODE)+'  overlay '+u32(A.SIG));
 o.push('party '+Array.prototype.join.call(rd(A.PARTY,3)||[],','),'in fight '+Array.prototype.join.call(rd(A.BLIVE,11)||[],','),'turn slot '+dash(u8(A.BTURN)));
 var tl=f==null?null:window.TREASURE&&TREASURE[f];
 o.push('treasure '+(tl?tl.map(function(t){var g=treGot(t[0],t[1]);return t[0]+'.'+t[1]+'='+(g==null?'-':g?1:0)}).join(' '):'none here'));
 o.push('battle timer '+(world?[s32(A.WENCC),s32(A.WENCW),s32(A.WENCN),u16(A.WENCS),u16(A.WENCS+2),s32(A.WENCON)]:[s32(A.ENC),s32(A.ENC+4),s32(A.ENC+8),u16(A.ENC+12),u16(A.ENC+14)]).map(dash).join(' '));
 o.push('field '+dash(f)+'  story step '+dash(u16(A.STORY))+' '+(chapter()||'-'));
 var q=playerPos();o.push('pos '+(q?q.x+','+q.y+','+q.z+' face '+q.face:'-')+'  cam '+dash(u16(A.CAMDIR)));
 if(!world)o.push('world -');else{var x=s32(A.WPOS),y=s32(A.WPOS+4),z=s32(A.WPOS+8),sx=s32(A.WSTART),sz=s32(A.WSTART+8);
  o.push('world pos '+(x==null?'-':(x>>12)+','+(y>>12)+','+(z>>12))+' start '+(sx==null||sz==null?'-':(sx>>12)+','+(sz>>12))+' ang '+dash(u32(A.WANG))+' mode '+dash(u32(A.WMODE))+' saved '+dash(u16(A.WSAVE))+','+dash(u16(A.WSAVE+2)))}
 var ev=u8(A.EVT),ctl=u16(A.EVT2),sf=u32(A.SCENEFL);
 if(inBattling()){var bp=A.BTLP,be=A.BTLE;o.push('arena you '+dash(s16(bp))+'/'+dash(s16(bp+8))+' +2 '+dash(s16(bp+2))+' +A '+dash(s16(bp+10))+'  foe '+dash(s16(be))+'/'+dash(s16(be+8))+' +2 '+dash(s16(be+2))+'  idx '+dash(u32(A.BTLIX))+','+dash(u32(A.BTLIX+4)))}
 o.push('live floor '+(LIVE.f==null?'-':'room '+LIVE.f+' step '+LIVE.st+(LIVE.map[LIVE.f]?' ok':'')+(LIVE.err?' '+LIVE.err:''))+'  ptr '+dash(u32(A.WALKB)&&(u32(A.WALKB)>>>0).toString(16))+' loading '+dash(u32(A.ROOMCHG)));
 o.push('walk layer '+dash(playerLayer())+'  seen here '+((layerSeen[u16(A.FIELD)&0x7FF]|0)>>1).toString(2));o.push('scene lock menu '+dash(ev)+' ctl '+(ctl==null?'-':ctl.toString(16))+' flags '+(sf==null?'-':(sf>>>0).toString(16))+'  in scene '+rawEvent());
 o.push('text boxes '+[0,1,2,3].map(function(i){var a=u16(A.TBOX+i*TBREC+0x410),v=u16(A.TBOX+i*TBREC+0x40E);return a==null?'-':a.toString(16)+'/'+v.toString(16)}).join(' ')+'  open '+boxOpen());
 if(lastErr)o.push('error '+lastErr);
 o.push('dialogue now '+inDialogue());
 if(blog.length)o=o.concat(['fight log (slot name hp st rm):'],blog.slice(-18));
 return o}
/* fill the settings panel */
/* v2.0.0.14: each group folds: tap its heading (kept in LS 'setc'). The panel is opened in drawSet and each heading closes the group
   before it, so '</div>' first. DEVELOPER only shows once DEV OPTIONS is on, or after five taps on the version line. */
var SETC=(function(){try{return JSON.parse(LS.get('setc','{}'))||{}}catch(e){return {}}})(),devTaps=0;
function setHd(t){var sh=!!SETC[t];return '</div><div class="sgrp'+(sh?' shut':'')+'"><div class="opt sethd" onclick="setTog(\''+t+'\')">'+T((sh?'+ ':'- ')+t,'y')+'</div>'}
function setTog(t){if(SETC[t])delete SETC[t];else SETC[t]=1;LS.set('setc',JSON.stringify(SETC));lastSet='';drawSet()}
function devTap(){if(CFG.dev)return;if(++devTaps>=5){devTaps=0;sv('dev','1')}else{lastSet='';drawSet()}}
/* RESET: every switch back to how the app ships; the link (host, port), your notes and the journal are kept */
var SET_KEYS=['mode','poll','fast','dot','intro','dev','scale','maprot','plan','hdot','tre','gift','enl','hint','exits','places','x3d','xeye','route','follow','advise','boss','smooth','sky','enc','turns','seq','dball','xlog','rps','speed','quiet','map3d','map3eye','setc'];
function setReset(){popup('<div class="row">'+T('RESET SETTINGS','y')+'</div><div class="sep"></div>'+wrap('Every switch goes back to how the app ships. The link (host and port), the journal, the bestiary and your notes are kept.',40).map(function(l){return '<div class="row">'+T(l,'g')+'</div>'}).join('')
 +'<div class="row" style="height:16rem">'+chip('CANCEL',false,'event.stopPropagation();closePop()')+'<span class="sp"></span>'+chip('RESET',true,'event.stopPropagation();setResetGo()')+'</div>',240);document.getElementById('pop').style.zIndex=6}
function setResetGo(){SET_KEYS.forEach(function(k){try{localStorage.removeItem('xg_'+k)}catch(e){}});location.reload()}
function drawSet(){var h='<div class="opt">'+T('SETTINGS','y')+'<span class="sp"></span>'+chip('CLOSE',false,'closeSet()')+'</div>'
  +'<div class="opt">'+T('Lit = on. Tap a switch to change it.','g')+'</div><div>';
 /* v2.0.0.20: one chip per switch (lit = on), related switches on one row, instead of an ON / OFF pair per line */
 function sw(label,key){return chip(label,!!CFG[key],"sv('"+key+"','"+(CFG[key]?0:1)+"')")}
 h+=setHd('GENERAL');
 h+='<div class="opt">'+T('SIZE','c')+[70,80,90,100,110,120].map(function(s){return chip(String(s),CFG.scale===s,"sv('scale',"+s+")")}).join('')+'</div>';
 h+='<div class="opt">'+sw('START SCREEN','intro')+chip('APP TOUR',false,'closeSet();tourGo(0)')+chip('RESET ALL',false,'setReset()')+'</div>';
 h+=setHd('BATTLE');
 h+='<div class="opt">'+sw('COUNTDOWN','enc')+sw('BOSS CARDS','boss')+sw('TURN ORDER','turns')+'</div>';
 h+='<div class="opt">'+sw('COMBO KEYS','seq')+sw('LOCKED DEATHBLOWS','dball')+sw('SHOP ADVISOR','advise')+'</div>';
 h+=setHd('MAP');
 h+='<div class="opt">'+sw('TURN WITH CAMERA','maprot')+sw('ROOM ART','plan')+'</div>';
 h+='<div class="opt">'+sw('TREASURE','tre')+sw('GIFTS','gift')+sw('PLACES','places')+sw('ENEMIES','enl')+sw('EXITS','exits')+'</div>';
 h+=setHd('HINTS');
 h+='<div class="opt">'+sw('STORY HINT','hint')+sw('GREEN SPOTS','hdot')+sw('GUIDE LINE','route')+sw('FOLLOW PATH','follow')+'</div>';
 h+=setHd('EXPERIMENTAL');
 h+='<div class="opt">'+chip('3D MAP',CFG.x3d,CFG.x3d?"sv('x3d','0')":"expAsk('x3d')")+(CFG.x3d?chip('EYE MODE',CFG.xeye,CFG.xeye?"sv('xeye','0')":"expAsk('xeye')")+sw('SMOOTH 3D','smooth')+(CFG.xeye?sw('SKY IN EYE','sky'):''):'')+'</div>';
 if(CFG.dev){h+=setHd('DEVELOPER');
 /* everything below is for setting up and debugging the link; hidden unless DEV OPTIONS is switched on */
 h+='<div class="opt">'+chip('DEV OPTIONS',CFG.dev,"sv('dev','0')")+T('tap to hide','g')+'</div>';
 if(CFG.dev){
 h+='<div class="opt">'+T('HOST','c')+'<input id="ih" ontouchstart="kb(1)" onmousedown="kb(1)" value="'+CFG.host+'" onchange="sv(\'host\',this.value)">'+T('PORT','c')+'<input id="ip" ontouchstart="kb(1)" onmousedown="kb(1)" style="width:50rem" value="'+CFG.port+'" onchange="sv(\'port\',this.value)"></div>';
 h+='<div class="opt">'+T('LINK','c')+['auto','m80','m00','ram'].map(function(m){return chip(m.toUpperCase(),CFG.mode===m,"sv('mode','"+m+"')")}).join('')+'</div>';
 h+='<div class="opt">'+sw('STATUS DOT','dot')+sw('FAST MAP','fast')+sw('RPS HELPER','rps')+sw('SPEED HELPER','speed')+'</div>';
 if(window.Native&&Native.snapSave){h+='<div class="opt">'+T('STORY SNAPSHOT','c')+chip('SAVE NOW',false,'snapTake()')+chip('FOLDER',false,'Native.snapOpen()')+'</div>';
  h+='<div class="opt">'+T('NOTE','c')+'<input id="isn" style="width:200rem" ontouchstart="kb(1)" onmousedown="kb(1)" oninput="snapNote=this.value" placeholder="what just happened" value="'+snapNote.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"></div>';if(snapMsg)h+='<div class="opt">'+T(snapMsg.slice(0,44),'g')+'</div>'}
 if(dumpOn()){h+='<div class="opt">'+T('RAM DUMP','c')+chip(DUMP?'READING...':'SAVE NOW',false,DUMP?'':'dumpStart()')+chip('FOLDER',false,'Native.ramOpen()')+'</div>';if(dumpMsg)h+='<div class="opt">'+T(dumpMsg.slice(0,44),dumpMsg.indexOf('NOT')===0?'r':'g')+'</div>'}
 h+='<div class="opt">'+sw('ROOM LOG','xlog')+chip('VIEW',false,'closeSet();rlogView()')+(window.Native&&Native.exitLogOpen?chip('FOLDER',false,'Native.exitLogOpen()'):'')+(window.Native&&Native.exitLogShare?chip('SHARE',false,'Native.exitLogShare()'):'')+T(xlogN+' THIS RUN','g')+'</div>';
 h+='<div class="opt">'+T('FIGHT LOG','c')+chip('SHOW',false,'showLog()')+T(blog.length?blog.length+' LINES':'EMPTY','g')+'</div>';
 h+='<pre>'+readout().join('\n')+'</pre>'}}
 h+='</div><div class="opt setver" onclick="devTap()">'+T('XENOGEARS LINK '+VERSION,'g')+(!CFG.dev&&devTaps?T('  '+(5-devTaps)+' MORE FOR DEV','g'):'')+'</div>';
 if(h!==lastSet){lastSet=h;document.getElementById('setin').innerHTML=h}}
/* change one setting: clean the value, store it, apply it, redraw */
/* experimental switches: a warning first, ENABLE to switch on (shown above the settings panel) */
function expAsk(k){var nm=k==='x3d'?'3D MAP':'EYE MODE',h='<div class="row">'+T('EXPERIMENTAL: '+nm,'y')+'</div><div class="sep"></div>';
 wrap((k==='x3d'?'Adds a 3D button to the map that draws the room from your disc image.':'Adds an EYE button to the 3D map: a first-person view at the party.')+' Frame rates may be low, and the app is more likely to stop responding or crash, mostly on Android. Switch it off here if that happens.',34).forEach(function(l){h+='<div class="row">'+T(l,'w')+'</div>'});
 h+='<div class="row" style="height:16rem">'+chip('CANCEL',false,'event.stopPropagation();closePop()')+'<span class="sp"></span>'+chip('ENABLE',true,"event.stopPropagation();closePop();sv('"+k+"','1')")+'</div>';
 popup(h,240);document.getElementById('pop').style.zIndex=6}
function sv(k,v){if(k==='host')v=okHost(v);if(k==='port')v=okPort(v);LS.set(k,v);if(k==='scale')v=+v;if(k==='quiet'){v=String(v)==='1';CFG.quiet=CFG.dlg=CFG.cut=v}
 if(k==='dot'||k==='maprot'||k==='mapmir'||k==='plan'||k==='dev'||k==='enc'||k==='tre'||k==='turns'||k==='places'||k==='seq'||k==='dball'||k==='gift'||k==='enl'||k==='hint'||k==='exits'||k==='fast'||k==='intro'||k==='hdot'||k==='x3d'||k==='xeye'||k==='xlog'||k==='route'||k==='follow'||k==='rps'||k==='speed'||k==='advise'||k==='boss'||k==='smooth'||k==='sky')v=String(v)==='1';if(k==='route'||k==='smooth'||k==='sky'){var mc=document.getElementById('mapcv');if(mc)mc._sig=null}CFG[k]=v;
 if((k==='x3d'||k==='xeye')&&!v){if(k==='x3d'&&map3on){map3on=false;LS.set('map3d','0')}if(map3eye){map3eye=false;LS.set('map3eye','0')}last={};render()}
 if(k==='mode'){linkMode=v==='auto'?null:v;probeIdx=0}if(k==='scale')fit();if(k==='dev'){last={};render()}if(!booted)bootStep();if(setOpen())drawSet()}
setInterval(function(){if(Date.now()-pollAt>=CFG.poll-30)poll();if(setOpen()&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))drawSet()},CFG.poll);
poll();
</script></body></html>
