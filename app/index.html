<script>
'use strict';
var lastErr='';window.onerror=function(m,src,line){lastErr=String(m).slice(0,60)+' @'+line;return false};
/* ================= settings ================= */
var LS={get:function(k,d){try{var v=localStorage.getItem('xg_'+k);return v===null?d:v}catch(e){return d}},set:function(k,v){try{localStorage.setItem('xg_'+k,v)}catch(e){}}};
/* saved values are checked on the way in, so a bad one can never stop the link or the layout */
function okHost(v){v=String(v).replace(/[^A-Za-z0-9.:\-]/g,'');return v||'127.0.0.1'}
/* a usable port number, or the default 55355 */
function okPort(v){v=Math.floor(+v);return v>0&&v<65536?v:55355}
/* v as a number if it lies between lo and hi, otherwise the default d */
function okNum(v,lo,hi,d){v=+v;return v>=lo&&v<=hi?v:d}
var MODES=['m80','m00','ram'];
/* QUIET is the one "hide during dialogue and scenes" switch. It replaced two separate switches (keys dlgauto and cut) in v1.41; a device that had either one on starts with it on. */
var QUIET=true;   /* v1.80: always on (with it off the map showed the cutscene rooms) */
var CFG={
 /* the link */
 host:okHost(LS.get('host','127.0.0.1')),port:okPort(LS.get('port','55355')),mode:LS.get('mode','auto'),poll:okNum(LS.get('poll','300'),100,2000,300),fast:LS.get('fast','1')==='1',
 /* look */
 scale:okNum(LS.get('scale','100'),50,200,100),dot:LS.get('dot','1')==='1',intro:LS.get('intro','1')==='1',dev:LS.get('dev','0')==='1',
 /* hiding during dialogue (dlg) and scenes (cut); grace = how long after the last text box before the party screen returns, fixed at one second */
 quiet:QUIET,dlg:QUIET,cut:QUIET,grace:1000,
 /* map */
 maprot:LS.get('maprot','1')==='1',plan:LS.get('plan','1')==='1',mapmir:false,hdot:LS.get('hdot','1')==='1',tre:LS.get('tre','1')==='1',gift:LS.get('gift','1')==='1',enl:LS.get('enl','1')==='1',hint:LS.get('hint','1')==='1',exits:LS.get('exits','1')==='1',places:LS.get('places','1')==='1',
 /* battle */
 x3d:LS.get('x3d','0')==='1',xeye:LS.get('xeye','0')==='1',
 route:LS.get('route','1')==='1',smooth:LS.get('smooth','1')==='1',sky:LS.get('sky','1')==='1',   /* 3D map: the way to go, eased camera, sky in EYE (v1.99.0.5) */   /* experimental: 3D map and its EYE view, off until switched on in SETTINGS > EXPERIMENTAL */
 enc:LS.get('enc','1')==='1',turns:LS.get('turns','1')==='1',seq:LS.get('seq','1')==='1',dball:LS.get('dball','0')==='1',
 /* DEV, Windows: log where each room change happens (exit log) */
 xlog:LS.get('xlog','1')==='1'};
if(MODES.indexOf(CFG.mode)<0)CFG.mode='auto';
var VERSION='1.99.0.10';   /* set by build.sh */
var HAS_NATIVE=!!window.Native;
var TEST=!HAS_NATIVE&&!!window.TestKit;   /* off-device testing only: a kit that is not part of the app can stand in for the game */
/* ================= room maps built from the player's own disc =================
   The walkable areas and room pictures are not shipped: the player picks their disc 1 image once and discbuild.js makes them
   into the app's own folder (Android: files/gen, Windows: the user data folder). HOST is the side that reads the disc and
   keeps the files: window.Native on the device and on Windows, a stand-in from the test kit off-device.
   manifest.json in that folder: {v, t (build time), rooms, maps, disc (file name), ext (picture file type)}. */
var HOST=window.Native&&Native.genDir?Native:(window.TestGen||null),GEN={ready:false,man:null,base:'',building:null};
function genLoad(){GEN.ready=false;GEN.man=null;if(!HOST)return;
 try{var d=String(HOST.genDir()||'').replace(/\\/g,'/');GEN.base=HOST.genUrl?HOST.genUrl(''):encodeURI((d.charAt(0)==='/'?'file://':'file:///')+d+'/');
  var m=HOST.genRead('manifest.json');if(m){GEN.man=JSON.parse(m);GEN.ready=GEN.man.maps>0}}catch(e){GEN.ready=false}}
/* where a built file is loaded from (null until the maps have been built) */
function asset(p){if(GEN.ready)return HOST.genUrl?HOST.genUrl(p):GEN.base+p+'?'+GEN.man.t;return window.BUNDLED?p:null}
/* test builds ship the maps inside the app (bundled.js); files built from the player's disc take over when present */
function mapsReady(){return GEN.ready||!!window.BUNDLED}
function picExt(){return GEN.ready?(GEN.man.ext||'webp'):(window.BUNDLED&&BUNDLED.ext)||'webp'}
function b64u8(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function genPut(path,data){var b=typeof data==='string'?btoa(unescape(encodeURIComponent(data))):XB.b64(data),r=HOST.genWrite(path,b);if(r!=='ok')throw new Error('Could not save '+path+' ('+r+')')}
/* picks the disc, then builds; the build runs a room at a time so the screen keeps updating, and can be stopped */
function discPick(){if(!HOST){popup('<div class="row">'+T('Building needs the app (Android or Windows).','r')+'</div>',200);return}
 window.onDiscPicked=function(name,size){if(name)genBuild(false)};HOST.discPick()}
function genAsk(){popup('<div class="row">'+T('REBUILD ROOM MAPS','y')+'</div><div class="row">'+T('From: '+String(GEN.man&&GEN.man.disc||'?').slice(0,30),'g')+'</div><div class="row" style="height:14rem">'+chip('SAME DISC',false,'event.stopPropagation();genBuild(true)')+chip('OTHER FILE',false,'event.stopPropagation();discPick2()')+'</div>',200)}
function discPick2(){window.onDiscPicked=function(n){if(n)genBuild(true)};HOST.discPick()}
function genStop(){if(GEN.building)GEN.building.stop=true}
async function genBuild(again){if(GEN.building)return;var job=GEN.building={stop:false,done:0,total:730,phase:'Opening the disc',err:''};genShow();
 try{
  var size=+HOST.discSize(),reader=function(o,n){var r=HOST.discRead(o,n);if(typeof r!=='string')return Promise.resolve(r);if(r.slice(0,4)==='ERR:')return Promise.reject(new Error(r.slice(4)));return Promise.resolve(b64u8(r))};
  var d=await XB.open(reader,size),ids=[],f,cv=document.createElement('canvas');cv.width=cv.height=512;var cx=cv.getContext('2d'),ext='webp';
  if(cv.toDataURL('image/webp',0.8).indexOf('data:image/webp')!==0)ext='png';   /* no WebP encoder: keep PNG */
  if(again&&HOST.genClear)HOST.genClear();
  for(f=0;f<730;f++)ids.push(f);if(TEST&&window.GEN_ONLY)ids=GEN_ONLY;job.total=ids.length;var rooms=0,maps=0;   /* GEN_ONLY: tests build a few rooms */
  for(var i=0;i<ids.length;i++){if(job.stop)throw new Error('Stopped. Tap BUILD to carry on.');f=ids[i];job.done=i;job.phase='Room '+f;genShow();
   await new Promise(function(r){setTimeout(r,0)});
   var mp='maps/'+f+'.js',pp='plan/'+f+'.'+ext;
   if(!again&&HOST.genHas(mp)&&(!PLAN[f]||HOST.genHas(pp))){maps++;if(PLAN[f])rooms++;continue}   /* carries on after a stop */
   XB.EXITS=window.EXITS;XB.MAPFIX=window.MAPFIX;var h=await d.file(606+2*f),mb=h?XB.mapBytes(h,f):null;genPut(mp,XB.mapJs(f,mb));maps++;
   if(PLAN[f]&&h){var px=await XB.roomPicture(d,f,PLAN[f],mb);
    if(px){cx.clearRect(0,0,512,512);cx.putImageData(new ImageData(px,512,512),0,0);var u=cv.toDataURL(ext==='webp'?'image/webp':'image/png',0.75);
     var r=HOST.genWrite(pp,u.slice(u.indexOf(',')+1));if(r!=='ok')throw new Error('Could not save '+pp);rooms++}
    var lvs=XB.levels(h);for(var li=0;li<lvs.length;li++){var lp='plan/'+f+'_'+lvs[li]+'.'+ext,lx=await XB.levelPicture(d,f,PLAN[f],lvs[li]);   /* lower levels' own pictures */
     if(lx){cx.clearRect(0,0,512,512);cx.putImageData(new ImageData(lx,512,512),0,0);var lu=cv.toDataURL(ext==='webp'?'image/webp':'image/png',0.75);if(HOST.genWrite(lp,lu.slice(lu.indexOf(',')+1))!=='ok')throw new Error('Could not save '+lp)}}}}
  genPut('manifest.json',JSON.stringify({v:XB.VERSION,t:Date.now(),rooms:rooms,maps:maps,disc:String(HOST.discName&&HOST.discName()||''),ext:ext}));
  job.done=job.total;job.phase='Done';genLoad();planCache={};planOrder=[];mapParsed={};mapReq={};window.MAPDATA={};last={}}
 catch(e){job.err=String(e&&e.message||e)}
 GEN.building=null;GEN.last=job;genShow();render()}
/* the build window (a pop-up while building or after it ends) */
function genShow(){var j=GEN.building||GEN.last;if(!j)return;var h='<div class="row">'+T('ROOM MAPS FROM YOUR DISC','y')+'</div>';
 if(GEN.building){h+='<div class="row">'+T(j.phase,'c')+'<span class="sp"></span>'+T(j.done+'/'+j.total,'g')+'</div><div class="row">'+bar('ep',j.done,j.total,'s')+'</div>'
  +'<div class="row">'+T('Keep the app open. About 5 to 20 min.','g')+'</div><div class="row" style="height:14rem"><span class="sp"></span>'+chip('STOP',false,'event.stopPropagation();genStop()')+'</div>'}
 else if(j.err)wrap(j.err,40).forEach(function(l){h+='<div class="row">'+T(l,'r')+'</div>'});
 else h+='<div class="row">'+T('Done: '+(GEN.man?GEN.man.rooms:0)+' room pictures.','n')+'</div>';

   +16 a flag per slot. That gives every enemy's exact record, so its exact name. A slot flagged 0x80 whose record has no name is not
   a real enemy: the Aveh soldier fights (rooms 57, 58) carry one such unnamed record, which sits in the slot list with full HP for
   the whole fight and is still there when the fight is won; it is marked hide. The copy is only trusted when every enemy it lists
   has the max HP its record says, and no other slot is marked as in the fight. Returns the eight names or null. */
function lineup(sl){var b=rd(A.BFORM,0x20);if(!b||!window.ENEMIES)return null;var k=b[0],e=k===52||k===68?null:ENEMIES[k-(k>52?1:0)-(k>68?1:0)];if(!e)return null;var out=[],n=0,late=[];

 document.getElementById('app').className=(mv?'quiet movie':dl?'quiet':'')+(booted&&!linked?' stale':'');var md=ed?'z':mv?'m':bl?'a':sh?'s':pk?'p':de?'e':dl?'d':bt?'b':'f';if(md!==lastMd){lastMd=md;closePop();hpSeen={};enemyId={};if(md==='b'){bankCache={};blog=[];blast={};bstart=Date.now();startOut={}}}

 var pt=u32(A.PTIME),pts=pt==null?null:Math.floor(pt/60),hh=pts==null?null:Math.floor(pts/3600),mm=pts==null?null:Math.floor(pts/60)%60,ss=pts==null?null:pts%60;   /* the play time itself (vertical blanks); the clock bytes can be stale after a load */put('clock',hh==null?'':T(p2(hh)+':'+p2(mm)+(loc.length+(rg?5:0)>8?'':':'+p2(ss))));

 if(mv){document.getElementById('main').className='';put('main',win('<img class="ttl" src="img/title.png">'+T('FF',ffOn?'n':'w'),'btn big'+(ffOn?' on':''),'onclick="ff()"'));put('bot','');encDraw();moreHint();return}
 document.getElementById('main').className=pk||(!dl&&!bt&&!sh&&tab==='equip')?'scroll':'';

 else if(bt)b+=battleTot?win(T('Rewards:','y')+'<span class="sp"></span>'+T('EXP','c')+T(pad(battleTot[0],7))+T(pad(battleTot[1],8))+T(' G','y'),'rew',CFG.dev?'onclick="showLog()"':''):'<span class="sp"></span>';
 else [['status','STATUS'],['equip','EQUIP'],['items','ITEMS'],['map','MAP']].forEach(function(t){b+=win(T(t[1],tab===t[0]?'y':'g'),'btn'+(tab===t[0]?' on':''),'onclick="setTab(\''+t[0]+'\')"')});

/* switch tab */
function setTab(t){tab=t;LS.set('tab',t);fullKey='';poll();render()}

/* ================= settings panel ================= */
var lastSet='';
/* a small tappable label; on = lit */
function chip(label,on,js){return '<span class="chip'+(on?' on':'')+'" onclick="'+js+'">'+T(label,on?'y':'w')+'</span>'}

/* open the settings panel */
function openSet(){lastSet='';document.getElementById('set').className='show';drawSet()}
/* let the app take keyboard focus (only while typing the host or port) */
function kb(on){if(HAS_NATIVE&&Native.focusable)Native.focusable(!!on)}
/* close the settings panel and redraw */
function closeSet(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();kb(0);document.getElementById('set').className='';last={};fullKey='';fit();render()}
/* the DEV readout: raw values behind everything the app shows, one line each, for checking against the game */
function dash(v){return v==null?'-':v}

function readout(){var f=u16(A.FIELD),world=u32(A.SIG)===5,o=[];f=f==null?null:f&0x7FF;
 o.push('native '+HAS_NATIVE,'link '+(linkMode||'probing '+MODES[probeIdx]),'replies '+(lastReply||'-')+'  '+pollRate()+' polls a second','program '+u32(A.MODE)+'  overlay '+u32(A.SIG));
 o.push('party '+Array.prototype.join.call(rd(A.PARTY,3)||[],','),'in fight '+Array.prototype.join.call(rd(A.BLIVE,11)||[],','),'turn slot '+dash(u8(A.BTURN)));
 var tl=f==null?null:window.TREASURE&&TREASURE[f];
 o.push('treasure '+(tl?tl.map(function(t){var v=u16(A.SVAR+t[0]);return t[0]+'.'+t[1]+'='+(v==null?'-':v>>t[1]&1)}).join(' '):'none here'));
 o.push('battle timer '+(world?[s32(A.WENCC),s32(A.WENCW),s32(A.WENCN),u16(A.WENCS),u16(A.WENCS+2),s32(A.WENCON)]:[s32(A.ENC),s32(A.ENC+4),s32(A.ENC+8),u16(A.ENC+12),u16(A.ENC+14)]).map(dash).join(' '));
 o.push('field '+dash(f)+'  story step '+dash(u16(A.STORY))+' '+(chapter()||'-'));
 var q=playerPos();o.push('pos '+(q?q.x+','+q.y+','+q.z+' face '+q.face:'-')+'  cam '+dash(u16(A.CAMDIR)));
 if(!world)o.push('world -');else{var x=s32(A.WPOS),y=s32(A.WPOS+4),z=s32(A.WPOS+8),sx=s32(A.WSTART),sz=s32(A.WSTART+8);
  o.push('world pos '+(x==null?'-':(x>>12)+','+(y>>12)+','+(z>>12))+' start '+(sx==null||sz==null?'-':(sx>>12)+','+(sz>>12))+' ang '+dash(u32(A.WANG))+' mode '+dash(u32(A.WMODE))+' saved '+dash(u16(A.WSAVE))+','+dash(u16(A.WSAVE+2)))}
 var ev=u8(A.EVT),ctl=u16(A.EVT2),sf=u32(A.SCENEFL);
 if(inBattling()){var bp=A.BTLP,be=A.BTLE;o.push('arena you '+dash(s16(bp))+'/'+dash(s16(bp+8))+' +2 '+dash(s16(bp+2))+' +A '+dash(s16(bp+10))+'  foe '+dash(s16(be))+'/'+dash(s16(be+8))+' +2 '+dash(s16(be+2))+'  idx '+dash(u32(A.BTLIX))+','+dash(u32(A.BTLIX+4)))}
 o.push('live floor '+(LIVE.f==null?'-':'room '+LIVE.f+' step '+LIVE.st+(LIVE.map[LIVE.f]?' ok':'')+(LIVE.err?' '+LIVE.err:''))+'  ptr '+dash(u32(A.WALKB)&&(u32(A.WALKB)>>>0).toString(16))+' loading '+dash(u32(A.ROOMCHG)));
 o.push('walk layer '+dash(playerLayer())+'  seen here '+((layerSeen[u16(A.FIELD)&0x7FF]|0)>>1).toString(2));o.push('scene lock menu '+dash(ev)+' ctl '+(ctl==null?'-':ctl.toString(16))+' flags '+(sf==null?'-':(sf>>>0).toString(16))+'  in scene '+rawEvent());
 o.push('text boxes '+[0,1,2,3].map(function(i){var a=u16(A.TBOX+i*TBREC+0x410),v=u16(A.TBOX+i*TBREC+0x40E);return a==null?'-':a.toString(16)+'/'+v.toString(16)}).join(' ')+'  open '+boxOpen());
 if(lastErr)o.push('error '+lastErr);
 o.push('dialogue '+(DLG?DLG.a.length+' signals, now '+inDialogue():'no extra signals'));
 if(blog.length)o=o.concat(['fight log (slot name hp st rm):'],blog.slice(-18));
 if(DLG)o.push('signals (address=value now):',DLG.a.map(function(a){var v=u8(a);return a.toString(16)+'='+(v==null?'--':(v<16?'0':'')+v.toString(16))}).join(' '));
 return o}
/* fill the settings panel */
function setHd(t){return '<div class="opt sethd">'+T(t,'y')+'</div>'}

 h+=setHd('GENERAL');

 h+='<div class="opt">'+T('DEATHBLOWS','c')+chip('LEARNED',!CFG.dball,"sv('dball','0')")+chip('SHOW ALL',CFG.dball,"sv('dball','1')")+'</div>';
 h+=setHd('MAP');
 h+='<div class="opt">'+T('VIEW','c')+chip('CAMERA',CFG.maprot,"sv('maprot','1')")+chip('FIXED',!CFG.maprot,"sv('maprot','0')")+chip('ART',CFG.plan,"sv('plan','"+(CFG.plan?0:1)+"')")+'</div>';
 h+='<div class="opt">'+T('MARKS','c')+chip('TREASURE',CFG.tre,"sv('tre','"+(CFG.tre?0:1)+"')")+chip('GIFTS',CFG.gift,"sv('gift','"+(CFG.gift?0:1)+"')")+chip('PLACES',CFG.places,"sv('places','"+(CFG.places?0:1)+"')")+'</div>';
 h+='<div class="opt">'+T('LISTS','c')+chip('ENEMIES',CFG.enl,"sv('enl','"+(CFG.enl?0:1)+"')")+chip('EXITS',CFG.exits,"sv('exits','"+(CFG.exits?0:1)+"')")+'</div>';
 h+=setHd('HINTS');
 h+=onoff('STORY HINT','hint',CFG.hint);
 h+='<div class="opt">'+T('HINT MAPS','c')+chip('GREEN SPOTS',CFG.hdot,"sv('hdot','1')")+chip('PICTURE ONLY',!CFG.hdot,"sv('hdot','0')")+'</div>';
 h+=setHd('EXPERIMENTAL');
 h+='<div class="opt">'+T('3D MAP','c')+chip('ON',CFG.x3d,CFG.x3d?'':"expAsk('x3d')")+chip('OFF',!CFG.x3d,"sv('x3d','0')")+'</div>';
 if(CFG.x3d)h+='<div class="opt">'+T('EYE MODE','c')+chip('ON',CFG.xeye,CFG.xeye?'':"expAsk('xeye')")+chip('OFF',!CFG.xeye,"sv('xeye','0')")+'</div>';

 /* everything below is for setting up and debugging the link; hidden unless DEV OPTIONS is switched on */

 if(CFG.dev){
 h+='<div class="opt">'+T('HOST','c')+'<input id="ih" ontouchstart="kb(1)" onmousedown="kb(1)" value="'+CFG.host+'" onchange="sv(\'host\',this.value)">'+T('PORT','c')+'<input id="ip" ontouchstart="kb(1)" onmousedown="kb(1)" style="width:50rem" value="'+CFG.port+'" onchange="sv(\'port\',this.value)"></div>';
 h+='<div class="opt">'+T('LINK','c')+['auto','m80','m00','ram'].map(function(m){return chip(m.toUpperCase(),CFG.mode===m,"sv('mode','"+m+"')")}).join('')+'</div>';
 h+='<div class="opt">'+T('STATUS DOT','c')+chip('SHOW',CFG.dot,"sv('dot','1')")+chip('HIDE',!CFG.dot,"sv('dot','0')")+'</div>';

 if(window.Native&&Native.snapSave){h+='<div class="opt">'+T('STORY SNAPSHOT','c')+chip('SAVE NOW',false,'snapTake()')+chip('FOLDER',false,'Native.snapOpen()')+'</div>';
  h+='<div class="opt">'+T('NOTE','c')+'<input id="isn" style="width:200rem" ontouchstart="kb(1)" onmousedown="kb(1)" oninput="snapNote=this.value" placeholder="what just happened" value="'+snapNote.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"></div>';if(snapMsg)h+='<div class="opt">'+T(snapMsg.slice(0,44),'g')+'</div>'}
 if(dumpOn()){h+='<div class="opt">'+T('RAM DUMP','c')+chip(DUMP?'READING...':'SAVE NOW',false,DUMP?'':'dumpStart()')+chip('FOLDER',false,'Native.ramOpen()')+'</div>';if(dumpMsg)h+='<div class="opt">'+T(dumpMsg.slice(0,44),dumpMsg.indexOf('NOT')===0?'r':'g')+'</div>'}

 h+='<div class="opt">'+T('FIGHT LOG','c')+chip('SHOW',false,'showLog()')+T(blog.length?blog.length+' LINES':'EMPTY','g')+'</div>';
 if(teach){if(teach.msg)h+='<div class="opt">'+T(teach.msg,'y')+'</div>';else{var ts=TEACH_STEPS[teach.step];

/* change one setting: clean the value, store it, apply it, redraw */
/* experimental switches: a warning first, ENABLE to switch on (shown above the settings panel) */
function expAsk(k){var nm=k==='x3d'?'3D MAP':'EYE MODE',h='<div class="row">'+T('EXPERIMENTAL: '+nm,'y')+'</div><div class="sep"></div>';
 wrap((k==='x3d'?'Adds a 3D button to the map that draws the room from your disc image.':'Adds an EYE button to the 3D map: a first-person view at the party.')+' Frame rates may be low, and the app is more likely to stop responding or crash, mostly on Android. Switch it off here if that happens.',34).forEach(function(l){h+='<div class="row">'+T(l,'w')+'</div>'});
